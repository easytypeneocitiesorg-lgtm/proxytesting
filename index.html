<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <meta name="description" content="A streamlined productivity and organization tool designed for managing tasks, notes, and daily workflow.">
    <meta name="keywords" content="productivity, tools, workflow, planner, dashboard, utilities, notes, tasks">
    <meta property="og:title" content="TaskFlow — Your Daily Productivity Hub">
    <meta property="og:description" content="A clean, fast, and useful tool for organizing tasks, notes, and personal workflow.">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            margin: 0;
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }
        /* Interactive background canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        
        .game-block {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #27272a;
            backdrop-filter: blur(4px);
        }
        
        .game-block:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #22c55e;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        
        .game-block img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        
        .game-block:hover img {
            transform: scale(1.08);
        }
        
        .game-block p {
            color: white;
            text-align: center;
            margin: 0;
            padding: 14px 8px;
            font-size: 1rem;
            font-weight: 500;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        /* player container */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9998;
            display: none;
        }
        #game-frame {
            border: none;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #back-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.8);
            color: black;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        #back-btn:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <!-- Interactive particle background -->
    <canvas id="bg-canvas"></canvas>
    <div class="content-wrapper">
        <div class="max-w-7xl mx-auto px-6 py-10">
            <h1 class="text-5xl font-bold tracking-tight mb-12 text-center">TaskFlow</h1>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
                <!-- TaskFlow -->
                <div class="game-block" onclick="launchProxGame('https://vidsrc.pm/embed/tv/60625/1/1')">
                    <img src="https://cdn-icons-png.flaticon.com/512/18240/18240592.png" alt="Proxied Site">
                    <p>Proxied Site</p>
                </div>
                
            </div>
        </div>
    </div>
    <!-- In-Page Game Container Overlay -->
    <div id="game-container">
        <button id="back-btn" onclick="closeGame()">← Back</button>
        <div id="loading-text" style="display:none; color:white; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.5rem; font-weight:600; z-index: 9999;">Loading...</div>
        <iframe id="game-frame" allowfullscreen></iframe>
    </div>
<script>
    console.log("SCRIPT LOADED");
    // ========== INTERACTIVE PARTICLE BACKGROUND ==========
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };
    let animationId;
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.2 + 0.8;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = Math.random() * 25 + 8;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.color = `rgba(34, 197, 94, ${Math.random() * 0.5 + 0.25})`;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            if (mouse.x !== null) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    const forceX = (dx / distance) * force * this.density * 0.35;
                    const forceY = (dy / distance) * force * this.density * 0.35;
                    this.x -= forceX;
                    this.y -= forceY;
                }
            }
        }
    }
    function initParticles() {
        particles = [];
        const numberOfParticles = Math.min(Math.floor((canvas.width * canvas.height) / 9000), 140);
        for (let i = 0; i < numberOfParticles; i++) {
            particles.push(new Particle());
        }
    }
    function connectParticles() {
        const maxDistance = 110;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a + 1; b < particles.length; b++) {
                const dx = particles[a].x - particles[b].x;
                const dy = particles[a].y - particles[b].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < maxDistance) {
                    const opacity = 1 - (distance / maxDistance);
                    ctx.strokeStyle = `rgba(34, 197, 94, ${opacity * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        connectParticles();
        animationId = requestAnimationFrame(animate);
    }
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
    });
    window.addEventListener('resize', () => {
        resizeCanvas();
        initParticles();
    });
    resizeCanvas();
    initParticles();
    animate();

    // ========== GAME LOGIC ==========
    function launchGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        if (loading) loading.style.display = 'none';

        // clean previous blob if any
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');
        frame.setAttribute('data-no-proxy', 'true');
        frame.src = url;

        frame.style.display = 'block';
        container.style.display = 'block';
    }

    async function launchProxGame(url) {
    const container = document.getElementById('game-container');
    const frame = document.getElementById('game-frame');
    const loading = document.getElementById('loading-text');

    container.style.display = 'block';
    frame.style.display = 'none';
    if (loading) {
        loading.style.display = 'block';
        loading.innerText = 'Loading...';
    }

    // clean previous blob
    if (frame._blobUrl) {
        URL.revokeObjectURL(frame._blobUrl);
        frame._blobUrl = null;
    }

    frame.removeAttribute('srcdoc');

    // KEEP the opt-out so the parent interceptor does not rewrite the blob URL
    frame.setAttribute('data-no-proxy', 'true');

    const relayBase = "https://logistical-utilities.vercel.app";
    const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(url);

    try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Proxy returned ' + response.status);

        const html = await response.text();

        const blob = new Blob([html], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);

        frame._blobUrl = blobUrl;
        frame.src = blobUrl;               // now protected by data-no-proxy

        frame.onload = function() {
            if (loading) loading.style.display = 'none';
            frame.style.display = 'block';
        };
    } catch (err) {
        console.error(err);
        if (loading) loading.innerText = 'Failed to load.';
    }
}

    function closeGame() {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        container.style.display = 'none';

        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.src = '';
        frame.removeAttribute('srcdoc');
        frame.removeAttribute('data-no-proxy');
        if (loading) loading.style.display = 'none';
    }

    function launchProtectedGame(url) {
        const password = prompt('Password:');
        if (password === 'cinnamon29') {
            launchGame(url);
        }
    }

    function launchProtectedProxGame(url) {
        const password = prompt('Password:');
        if (password === 'cinnamon29') {
            launchProxGame(url);
        }
    }

    // Leave confirmation
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = '';
    });
    window.onbeforeunload = function () {
        return '';
    };
</script>
</body>
</html>
